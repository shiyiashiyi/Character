name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build FrontStudy.Api/FrontStudy.Api.csproj
      - name: Run tests
        run: dotnet run --project FrontStudy.Api.Tests/FrontStudy.Api.Tests.csproj

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
